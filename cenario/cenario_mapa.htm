<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../recursos/estilos/pagina.css">
    <link rel="stylesheet" href="../recursos/estilos/texto.css">
    <link rel="stylesheet" href="../recursos/estilos/topico.css">
    <link rel="stylesheet" href="../recursos/estilos/menu_overlay.css">
    <link rel="stylesheet" href="../recursos/estilos/imagens.css">
    <link rel="stylesheet" href="../recursos/estilos/mapa.css">
    <script src="../recursos/scripts/menu_overlay.js"></script>
    

    <title>Capivaras & Calabouços - Mapa de Phantasia</title>
</head>

<body>

    <div id="viewport">
        <img id="imagem" src="../recursos/imagens/locais/mapa_phantasia.png" alt="">
    </div>

    <div id="controlesMapa">

        <div class="grupoZoom">

            <button
                class="botaoZoom"
                id="zoomMais"
                aria-label="Aumentar zoom">
                +
            </button>

            <button
                class="botaoZoom"
                id="zoomMenos"
                aria-label="Diminuir zoom">
                −
            </button>

            <button
                class="botaoZoom"
                id="zoomReset"
                aria-label="Restaurar tamanho">
                ⟳
            </button>

        </div>

        <a
            class="botaoVoltarMapa"
            href="./cenario_locais.htm">
            Voltar
        </a>

    </div>

    <script src="../recursos/scripts/mapa.js"></script>

</body>
</html>
